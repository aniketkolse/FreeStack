name: CI

on:
  push:
    branches: ["main", "pre-launch-hardening"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  verify:
    name: Lint, Test, Validate Catalog, Build & Audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js 24 LTS
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ".nvmrc"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint (TypeScript strict check)
        run: npm run lint

      - name: Run unit & security test suite
        run: npm test

      - name: Validate catalog data & source registry
        run: npm run validate:data

      - name: Build production client & server
        run: npm run build

      - name: Check performance budgets (non-blocking)
        continue-on-error: true
        run: npm run perf:check

      - name: Production dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high
