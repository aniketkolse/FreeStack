name: Bug Report
description: Report a bug in the FreeStack web application, API, or validation scripts (for security issues, see SECURITY.md)
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Security Note:** Do **not** report security vulnerabilities in public issues. Please follow [SECURITY.md](../../SECURITY.md) to report privately.
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. Navigate to '/explore?category=ai-ml'
        2. Click on ...
        3. Observe error ...
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment (Browser, OS, Node version)
      placeholder: e.g., macOS 15, Chrome 131, Node v24.x
    validations:
      required: false
