<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d0f15" media="(prefers-color-scheme: dark)" />
    <title>FreeStack — Everything free to build, learn and create</title>
    <meta
      name="description"
      content="Discover verified free AI models, APIs, cloud credits, databases, developer tools, learning materials, and student benefits with clear limits and source evidence."
    />
    <meta property="og:title" content="FreeStack — Everything free to build, learn and create" />
    <meta
      property="og:description"
      content="Discover verified free AI models, APIs, cloud credits, databases, developer tools, learning materials, and student benefits with clear limits and source evidence."
    />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
      rel="stylesheet"
    />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('freestack-theme');
          var sysDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
          var dark = stored === 'dark' || (!stored && sysDark);
          document.documentElement.classList.toggle('dark', !!dark);
          document.documentElement.style.colorScheme = dark ? 'dark' : 'light';
        } catch (e) {}
      })();
    </script>
  </head>
  <body class="bg-paper text-ink antialiased selection:bg-sunshine-yellow selection:text-midnight-mouth">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
